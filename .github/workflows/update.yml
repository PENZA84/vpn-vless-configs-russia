name: Update VPN Configs
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force clean to origin/main (remove conflicts)
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Create config_sources.json from secret
        run: echo '${{ secrets.VPN_SOURCES }}' > config_sources.json

      - name: Run mirror.py
        run: python mirror.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          # Если нет изменений — выходим
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита"
            exit 0
          fi
          git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M:%S')"
          # Используем force-with-lease, чтобы не затереть чужие изменения,
          # но перезаписываем локальную версию, если удалённая ушла вперёд.
          # Это безопасно, потому что мы хотим, чтобы результат скрипта был единственным источником истины.
          git push --force-with-lease origin main
